<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>
    <!-- Background tile -->
    <rect width="512" height="512" rx="112" fill="#090d18" stroke="#00d2ff" stroke-width="12" stroke-opacity="0.35"/>
    
    <!-- Fine technical blueprint grid/ticks -->
    <line x1="256" y1="36" x2="256" y2="64" stroke="#00d2ff" stroke-width="4" stroke-opacity="0.3"/>
    <line x1="256" y1="448" x2="256" y2="476" stroke="#00d2ff" stroke-width="4" stroke-opacity="0.3"/>
    <line x1="36" y1="256" x2="64" y2="256" stroke="#00d2ff" stroke-width="4" stroke-opacity="0.3"/>
    <line x1="448" y1="256" x2="476" y2="256" stroke="#00d2ff" stroke-width="4" stroke-opacity="0.3"/>
    
    <!-- Subtle dashed geometric guide triangle -->
    <polygon points="256,128 142,326 370,326" fill="none" stroke="#00d2ff" stroke-width="6" stroke-opacity="0.22" stroke-dasharray="14 10"/>

    <!-- Three Points of Therefore (∴) with electric cyan glow -->
    <!-- Top Point -->
    <circle cx="256" cy="128" r="44" fill="#00d2ff" filter="url(#glow)"/>
    <circle cx="256" cy="128" r="20" fill="#ffffff"/>
    
    <!-- Bottom Left Point -->
    <circle cx="142" cy="326" r="44" fill="#00d2ff" filter="url(#glow)"/>
    <circle cx="142" cy="326" r="20" fill="#ffffff"/>
    
    <!-- Bottom Right Point -->
    <circle cx="370" cy="326" r="44" fill="#00d2ff" filter="url(#glow)"/>
    <circle cx="370" cy="326" r="20" fill="#ffffff"/>
</svg>